<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Equipment Borrowing System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-box">

        <div class="login-logo">
            EBS
        </div>

        <h1>Equipment Borrowing System</h1>

        <p class="login-subtitle">
            Online Equipment Borrowing and Return Monitoring
        </p>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-btn login-btn"
            >
                Login
            </button>

            <p id="loginMessage"></p>

        </form>

    </div>


    <script type="module" src="auth.js"></script>

</body>

</html>
